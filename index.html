<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; media-src * data: blob: https:; img-src * data: blob: https:; connect-src * data: blob: https:; frame-src * https: data:; child-src * https: data:;">
  <title>Grok Desktop</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --color-text: #000000;
      --color-bg-toolbar: #F9F8F6;
      --color-bg-tab: #F9F8F6;
      --color-bg-tab-active: #ffffff;
      --color-bg-content: #ffffff;
      --color-border: #dddddd;
      --color-hover: #dddddd;
      --color-aot-border: #cccccc;
      --color-aot-hover: #e6e6e6;
      --scrollbar-track: #f1f1f1;
      --scrollbar-thumb: #c1c1c1;
      --scrollbar-thumb-hover: #a8a8a8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-text: #e6e6e6;
        --color-bg-toolbar: #1e1f22;
        --color-bg-tab: #2b2d31;
        --color-bg-tab-active: #3b3e45;
        --color-bg-content: #2b2d31;
        --color-border: #444444;
        --color-hover: #444444;
        --color-aot-border: #555555;
        --color-aot-hover: #444444;
        --scrollbar-track: #2a2b2f;
        --scrollbar-thumb: #55595f;
        --scrollbar-thumb-hover: #666b73;
      }
    }

    :root.dark {
      --color-text: #e6e6e6;
      --color-bg-toolbar: #1e1f22;
      --color-bg-tab: #2b2d31;
      --color-bg-tab-active: #3b3e45;
      --color-bg-content: #2b2d31;
      --color-border: #444444;
      --color-hover: #444444;
      --color-aot-border: #555555;
      --color-aot-hover: #444444;
      --scrollbar-track: #2a2b2f;
      --scrollbar-thumb: #55595f;
      --scrollbar-thumb-hover: #666b73;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: var(--color-text);
    }

    .tabs-container {
      width: 100%;
      height: 50px;
      background-color: var(--color-bg-toolbar);
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .tabs {
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .tabs-scroll {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: none;
      color: var(--color-text);
      font-size: 18px;
      width: 28px;
      height: 40px;
      cursor: pointer;
      align-self: center;
      display: none;
    }
    .tabs-scroll:hover { background-color: var(--color-hover); }
    .tabs-scroll-left { margin-right: 2px; }
    .tabs-scroll-right { margin-left: 2px; }

    .tab {
      display: flex;
      align-items: center;
      border-right: 1px solid var(--color-border);
      min-width: 180px;
      max-width: 220px;
      padding: 0 10px;
      height: 40px;
      background-color: var(--color-bg-tab);
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .tab.active {
      background-color: var(--color-bg-tab-active);
    }

    .tab-title {
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      margin-right: 20px;
    }

    .tab-close {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      margin: 0;
      padding: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      color: var(--color-text);
    }

    .tab-close:hover {
      background-color: var(--color-hover);
    }

    .new-tab-button {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      width: 30px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 5px;
      color: var(--color-text);
    }

    .new-tab-button:hover {
      background-color: var(--color-hover);
    }

    .app-controls {
      display: flex;
      align-items: center;
      padding: 0 5px;
      flex: 0 0 auto;
      white-space: nowrap;
      overflow-x: auto;
      max-width: 340px;
    }

    .aot-button {
      background: none;
      border: 1px solid var(--color-aot-border);
      border-radius: 4px;
      margin-left: 3px;
      padding: 1px 5px;
      font-size: 12px;
      cursor: pointer;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--color-text);
      min-width: 24px;
    }

    .aot-button:hover {
      background-color: var(--color-aot-hover);
    }

    .aot-button.active {
      background-color: #4CAF50;
      color: white;
      border-color: #4CAF50;
    }

    .reload-button {
      background: none;
      border: 1px solid var(--color-aot-border);
      border-radius: 4px;
      margin-right: 3px;
      padding: 1px 5px;
      font-size: 14px;
      cursor: pointer;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--color-text);
      min-width: 24px;
    }

    .reload-button:hover {
      background-color: var(--color-aot-hover);
    }

    .reload-button.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .reload-icon {
      display: inline-block;
      transform-origin: center;
      pointer-events: none;
    }

    .reload-button.loading .reload-icon {
      animation: spin-reload 1s linear infinite;
    }

    @keyframes spin-reload {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .views-container {
      height: calc(100vh - 40px);
      width: 100%;
      position: relative;
      background-color: var(--color-bg-content);
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      background-color: var(--color-bg-content);
    }

    .view.active {
      display: block;
    }

    webview {
      width: 100%;
      height: 100%;
      border: none;
      background-color: var(--color-bg-content);
    }

    .usage-status-bar {
      display: none;
      min-height: 32px;
      background-color: var(--color-bg-toolbar);
      border-top: 1px solid var(--color-border);
      padding: 0 12px 8px 12px;
      align-items: center;
      justify-content: flex-start;
      gap: 24px;
      font-size: 12px;
      color: var(--color-text);
      flex-shrink: 0;
      box-sizing: content-box;
    }

    .usage-status-bar.active {
      display: flex;
    }

    .usage-stat {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .usage-label {
      opacity: 0.7;
    }

    .usage-value {
      font-weight: 600;
    }

    .usage-value.warning {
      color: #f39c12;
    }

    .usage-value.critical {
      color: #e74c3c;
    }

    .usage-refill .usage-value {
      color: #3498db;
    }

    .usage-toggle {
      padding: 2px 6px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s ease;
      font-size: 14px;
      user-select: none;
      order: -1;
      margin-right: -19px;
    }

    .usage-toggle:hover {
      opacity: 1;
    }

    .usage-toggle.hidden .toggle-icon {
      opacity: 0.4;
    }

    .usage-stat.hidden-stat {
      display: none;
    }

    body.usage-bar-active .views-container {
      height: calc(100vh - 40px - 41px);
    }

    /* ===== Indicador de Pasta (UX) ===== */
    .folder-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      background: #4CAF50;
      color: white;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      max-width: 260px;
      margin-right: 8px;
      cursor: default;
    }

    .folder-indicator.active {
      display: flex;
    }

    .folder-indicator .folder-icon {
      font-size: 14px;
    }

    .folder-indicator .folder-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-indicator .folder-close {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      opacity: 0.8;
      line-height: 1;
    }

    .folder-indicator .folder-close:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="tabs-container">
    <button class="tabs-scroll tabs-scroll-left" id="tabs-scroll-left" aria-hidden="true">&#x2039;</button>
    <div class="tabs" id="tabs"></div>
    <button class="tabs-scroll tabs-scroll-right" id="tabs-scroll-right" aria-hidden="true">&#x203A;</button>
    <div class="app-controls">
      <div id="update-indicator" style="margin-right:8px;font-size:12px;opacity:0.9;cursor:pointer;text-decoration:underline;display:none;"></div>
      
      <!-- Indicador visual da pasta selecionada -->
      <div class="folder-indicator" id="folder-indicator" title="">
        <span class="folder-icon">📁</span>
        <span class="folder-name" id="folder-name">Nenhuma pasta</span>
        <button class="folder-close" id="folder-close" title="Fechar pasta">×</button>
      </div>

      <button class="aot-button" id="folder-btn" title="Abrir pasta local">📂</button>
      <button class="reload-button" id="reload-button" title="Reload current tab"><span class="reload-icon">↻</span></button>
      <button class="aot-button" id="aot-button" title="Always on top">AOT</button>
      <button class="aot-button" id="update-btn" style="display:none;background:#ff3333;color:#fff;border-color:#cc0000;" title="Update available">↑</button>
      <button class="aot-button" id="usage-btn" title="Toggle Usage Stats">s</button>
      <button class="aot-button" id="info-btn" title="About">i</button>
      <button class="aot-button" id="devtools-btn" title="Abrir DevTools">🛠️</button>
    </div>
  </div>
  <div class="views-container" id="views"></div>
  <div class="usage-status-bar" id="usage-status-bar">
    <div class="usage-stat">
      <span class="usage-label">Low Effort:</span>
      <span class="usage-value" id="usage-low-effort">--</span>
    </div>
    <div class="usage-stat">
      <span class="usage-label">High Effort:</span>
      <span class="usage-value" id="usage-high-effort">--</span>
    </div>
    <div class="usage-stat" id="usage-grok4-container">
      <span class="usage-label">Grok 4 Heavy:</span>
      <span class="usage-value" id="usage-grok4-heavy">--</span>
    </div>
    <div class="usage-stat usage-refill" id="usage-refill-container" style="display:none;">
      <span class="usage-label">Refill:</span>
      <span class="usage-value" id="usage-refill">--</span>
    </div>
    <div class="usage-toggle" id="usage-grok4-toggle" title="Toggle Grok 4 Heavy stats">
      <span class="toggle-icon">👁</span>
    </div>
  </div>

  <script>
    // === VERSÃO SEGURA - usa window.api ===
    const currentVersionPromise = window.api.getVersion();
    let currentWorkingFolder = null;

    function parseTagName(tag) {
      if (!tag) return null;
      const m = tag.trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/);
      if (!m) return null;
      return { major: +m[1], minor: +m[2], patch: +m[3] };
    }

    function cmpSemver(a, b) {
      if (a.major !== b.major) return a.major - b.major;
      if (a.minor !== b.minor) return a.minor - b.minor;
      return a.patch - b.patch;
    }

    let latestReleaseUrl = null;

    async function checkForUpdate() {
      try {
        const currentVersionStr = await currentVersionPromise;
        const cur = parseTagName('v' + currentVersionStr);
        if (!cur) return;
        const data = await fetchLatestRelease();
        if (!data || !data.tag_name) return;
        const latest = parseTagName(data.tag_name);
        if (!latest) return;
        if (cmpSemver(latest, cur) > 0) {
          const btn = document.getElementById('update-btn');
          let releaseUrl = data.html_url || `https://github.com/AnRkey/Grok-Desktop/releases/tag/${data.tag_name}`;
          const githubReleasePattern = /^https:\/\/github\.com\/AnRkey\/Grok-Desktop\/releases\/tag\/[^/]+$/;
          if (githubReleasePattern.test(releaseUrl)) {
            latestReleaseUrl = releaseUrl;
            if (btn) {
              btn.style.display = 'inline-block';
              btn.title = `Version ${data.tag_name} available`;
            }
          }
        }
      } catch (_) {}
    }

    async function fetchLatestRelease() {
      try {
        const res = await fetch('https://api.github.com/repos/AnRkey/Grok-Desktop/releases/latest', {
          headers: { 'User-Agent': 'Grok-Desktop', 'Accept': 'application/vnd.github+json' }
        });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    // ===== Injeta texto no chat do Grok =====
    async function injectIntoGrokChat(text) {
      const activeTab = tabManager.tabs.find(t => t.id === tabManager.activeTabId);
      if (!activeTab || !activeTab.webview) {
        await window.api.writeClipboard(text);
        alert('Contexto copiado! Cole no chat com Ctrl+V');
        return;
      }

      try {
        const injected = await activeTab.webview.executeJavaScript(`
          (function() {
            const text = ${JSON.stringify(text)};
            const selectors = [
              'textarea',
              '[contenteditable="true"]',
              'div[role="textbox"]',
              '[data-testid*="input"]',
              '[placeholder*="Pergunte"]',
              '[placeholder*="Ask"]',
              '[placeholder*="Message"]',
              '[placeholder*="Como posso"]'
            ];

            let target = null;
            for (const sel of selectors) {
              const el = document.querySelector(sel);
              if (el) { target = el; break; }
            }

            if (target) {
              if (target.tagName === 'TEXTAREA' || target.tagName === 'INPUT') {
                target.value = text;
                target.dispatchEvent(new Event('input', { bubbles: true }));
                target.dispatchEvent(new Event('change', { bubbles: true }));
              } else {
                target.innerText = text;
                target.textContent = text;
                target.dispatchEvent(new Event('input', { bubbles: true }));
              }
              target.focus();
              return true;
            }
            return false;
          })();
        `);

        if (!injected) {
          await window.api.writeClipboard(text);
          alert('✅ Contexto copiado!\n\nCole no chat do Grok com Ctrl+V');
        }
      } catch (err) {
        console.error('Inject error:', err);
        await window.api.writeClipboard(text);
        alert('✅ Contexto copiado!\n\nCole no chat do Grok com Ctrl+V');
      }
    }

    // ===== Atualiza o indicador visual da pasta =====
    function updateFolderIndicator(folderPath) {
      const indicator = document.getElementById('folder-indicator');
      const nameEl = document.getElementById('folder-name');
      
      if (!indicator || !nameEl) return;

      if (folderPath) {
        const folderName = folderPath.split(/[/\\]/).filter(Boolean).pop() || folderPath;
        nameEl.textContent = folderName;
        indicator.title = folderPath;
        indicator.classList.add('active');
      } else {
        nameEl.textContent = 'Nenhuma pasta';
        indicator.title = '';
        indicator.classList.remove('active');
      }
    }

    window.api.receive('system-theme-updated', (theme) => {
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    });

    const tabManager = {
      tabs: [],
      activeTabId: null,
      tabsContainer: document.getElementById('tabs'),
      viewsContainer: document.getElementById('views'),
      newTabButton: null,
      
      init() {
        this.createNewTabButton();
        
        const reloadButton = document.getElementById('reload-button');
        reloadButton.addEventListener('click', () => {
          const activeTab = this.tabs.find(tab => tab.id === this.activeTabId);
          if (activeTab && activeTab.webview) {
            reloadButton.classList.add('loading');
            const removeLoading = () => {
              reloadButton.classList.remove('loading');
              activeTab.webview.removeEventListener('did-stop-loading', removeLoading);
            };
            activeTab.webview.addEventListener('did-stop-loading', removeLoading);
            activeTab.webview.reload();
          }
        });
        
        const aotButton = document.getElementById('aot-button');
        aotButton.addEventListener('click', () => {
          window.api.toggleAlwaysOnTop().then((isAlwaysOnTop) => {
            if (isAlwaysOnTop) aotButton.classList.add('active');
            else aotButton.classList.remove('active');
          });
        });
        
        this.createTab('https://grok.com');
        checkForUpdate();
        this.setupScrollButtons();
      },
      
      createNewTabButton() {
        if (!this.newTabButton) {
          this.newTabButton = document.createElement('button');
          this.newTabButton.className = 'new-tab-button';
          this.newTabButton.textContent = '+';
          this.newTabButton.addEventListener('click', () => this.createTab('https://grok.com'));
        }
        this.tabsContainer.appendChild(this.newTabButton);
      },
      
      updateNewTabButtonPosition() {
        if (this.newTabButton && this.newTabButton.parentNode) {
          this.newTabButton.parentNode.removeChild(this.newTabButton);
        }
        this.tabsContainer.appendChild(this.newTabButton);
        this.updateScrollButtons();
      },
      
      createTab(url) {
        const tabId = 'tab-' + Date.now();
        
        const tabElement = document.createElement('div');
        tabElement.className = 'tab';
        tabElement.id = tabId;
        tabElement.innerHTML = `<div class="tab-title">New Tab</div><button class="tab-close">×</button>`;
        
        const viewElement = document.createElement('div');
        viewElement.className = 'view';
        viewElement.id = 'view-' + tabId;
        
        const webview = document.createElement('webview');
        webview.src = url;
        webview.partition = 'persist:grok';
        webview.setAttribute('allowpopups', '');
        webview.setAttribute('allow', 'microphone; camera; autoplay; clipboard-read; clipboard-write; display-capture');
        webview.setAttribute('nodeintegration', 'false');
        webview.setAttribute('contextisolation', 'true');
        
        viewElement.appendChild(webview);

        const ensureWebviewBackground = () => {
          const bg = getComputedStyle(webview).backgroundColor;
          if (bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') {
            webview.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--color-bg-content').trim() || '#ffffff';
          }
        };
        ensureWebviewBackground();

        const applyAppleLightScheme = async () => {
          let currentUrl = '';
          try { currentUrl = webview.getURL ? webview.getURL() : ''; } catch (_) {}
          const target = (currentUrl || '').toLowerCase();
          const wcId = webview.getWebContentsId ? webview.getWebContentsId() : null;
          if (wcId && (target.includes('appleid.apple.com'))) {
            try { await window.api.forceLightColorScheme(wcId, true); } catch (_) {}
            webview.style.backgroundColor = '#ffffff';
          } else if (wcId) {
            try { await window.api.forceLightColorScheme(wcId, false); } catch (_) {}
            webview.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--color-bg-content').trim() || '';
          }
        };
        
        this.tabsContainer.appendChild(tabElement);
        this.viewsContainer.appendChild(viewElement);
        this.updateNewTabButtonPosition();
        
        tabElement.addEventListener('click', (e) => {
          if (!e.target.classList.contains('tab-close')) this.activateTab(tabId);
        });
        
        tabElement.querySelector('.tab-close').addEventListener('click', () => this.closeTab(tabId));
        
        webview.addEventListener('page-title-updated', (e) => {
          const titleElement = tabElement.querySelector('.tab-title');
          titleElement.textContent = e.title;
          titleElement.title = e.title;
        });
        
        webview.addEventListener('did-start-loading', () => tabElement.classList.add('loading'));
        webview.addEventListener('did-stop-loading', () => tabElement.classList.remove('loading'));
        webview.addEventListener('dom-ready', () => {
          ensureWebviewBackground();
          applyAppleLightScheme();
        });
        webview.addEventListener('did-navigate', () => applyAppleLightScheme());
        webview.addEventListener('did-navigate-in-page', () => applyAppleLightScheme());
        
        const handleOpenUrl = (targetUrl) => {
          const url = targetUrl;
          const internalPatterns = [
            /^https?:\/\/grok\.com(?:\/|$)/,
            /^https?:\/\/x\.ai(?:\/|$)/,
            /^https?:\/\/x\.com(?:\/|$)/,
            /^https?:\/\/accounts\.x\.ai(?:\/|$)/,
            /^https?:\/\/accounts\.google\.com(?:\/|$)/,
            /^https?:\/\/appleid\.apple\.com(?:\/|$)/
          ];

          if (/^https?:\/\/grok\.com\/sign-in/i.test(url) || /^https?:\/\/accounts\.x\.ai\/sign-in/i.test(url)) {
            if (typeof webview.loadURL === 'function') webview.loadURL(url);
            else webview.src = url;
            return;
          }

          const isInternalUrl = internalPatterns.some(pattern => pattern.test(url));
          if (isInternalUrl) {
            if (typeof webview.loadURL === 'function') webview.loadURL(url);
            else webview.src = url;
          } else {
            window.api.openExternal(url);
          }
        };

        webview.addEventListener('new-window', (e) => { e.preventDefault(); handleOpenUrl(e.url); });
        webview.addEventListener('will-navigate', (e) => {
          const url = e.url;
          const internal = /^https?:\/\/grok\.com(?:\/|$)/.test(url) ||
                           /^https?:\/\/x\.ai(?:\/|$)/.test(url) ||
                           /^https?:\/\/x\.com(?:\/|$)/.test(url) ||
                           /^https?:\/\/accounts\.x\.ai(?:\/|$)/.test(url) ||
                           /^https?:\/\/accounts\.google\.com(?:\/|$)/.test(url) ||
                           /^https?:\/\/appleid\.apple\.com(?:\/|$)/.test(url);
          if (!internal) {
            e.preventDefault();
            window.api.openExternal(url);
          }
        });
        
        this.tabs.push({ id: tabId, element: tabElement, view: viewElement, webview });
        this.activateTab(tabId);
        return tabId;
      },

      activateNextTab() {
        if (!this.tabs.length) return;
        const currentIndex = this.tabs.findIndex(t => t.id === this.activeTabId);
        const nextIndex = (currentIndex + 1) % this.tabs.length;
        this.activateTab(this.tabs[nextIndex].id);
      },

      activatePrevTab() {
        if (!this.tabs.length) return;
        const currentIndex = this.tabs.findIndex(t => t.id === this.activeTabId);
        const prevIndex = (currentIndex - 1 + this.tabs.length) % this.tabs.length;
        this.activateTab(this.tabs[prevIndex].id);
      },

      reloadActiveTab() {
        const activeTab = this.tabs.find(tab => tab.id === this.activeTabId);
        if (!activeTab || !activeTab.webview) return;
        const reloadButton = document.getElementById('reload-button');
        if (reloadButton) {
          reloadButton.classList.add('loading');
          const removeLoading = () => {
            reloadButton.classList.remove('loading');
            activeTab.webview.removeEventListener('did-stop-loading', removeLoading);
          };
          activeTab.webview.addEventListener('did-stop-loading', removeLoading);
        }
        activeTab.webview.reload();
      },

      setupScrollButtons() {
        this.leftBtn = document.getElementById('tabs-scroll-left');
        this.rightBtn = document.getElementById('tabs-scroll-right');
        this.scrollContainer = this.tabsContainer;
        if (this.leftBtn && this.rightBtn) {
          this.leftBtn.addEventListener('click', () => this.scrollByAmount(-200));
          this.rightBtn.addEventListener('click', () => this.scrollByAmount(200));
          this.scrollContainer.addEventListener('scroll', () => this.updateScrollButtons(), { passive: true });
          window.addEventListener('resize', () => this.updateScrollButtons());
          this.scrollContainer.addEventListener('wheel', (e) => {
            if (e.target.closest('.tabs-scroll')) return;
            if (e.ctrlKey) {
              e.preventDefault();
              if (e.deltaY > 0) this.activateNextTab();
              else if (e.deltaY < 0) this.activatePrevTab();
            } else {
              this.scrollContainer.scrollBy({ left: e.deltaY * 0.5, behavior: 'auto' });
              e.preventDefault();
            }
          }, { passive: false });
          this.updateScrollButtons();
        }
      },

      scrollByAmount(dx) {
        this.scrollContainer.scrollBy({ left: dx, behavior: 'smooth' });
      },

      updateScrollButtons() {
        if (!this.leftBtn || !this.rightBtn) return;
        const sc = this.scrollContainer;
        this.leftBtn.style.display = sc.scrollLeft > 0 ? 'inline-flex' : 'none';
        this.rightBtn.style.display = Math.ceil(sc.scrollLeft + sc.clientWidth) < sc.scrollWidth ? 'inline-flex' : 'none';
      },
      
      activateTab(tabId) {
        if (this.activeTabId) {
          const activeTab = this.tabs.find(tab => tab.id === this.activeTabId);
          if (activeTab) {
            activeTab.element.classList.remove('active');
            activeTab.view.classList.remove('active');
          }
        }
        const tab = this.tabs.find(tab => tab.id === tabId);
        if (tab) {
          tab.element.classList.add('active');
          tab.view.classList.add('active');
          this.activeTabId = tabId;
        }
      },
      
      closeTab(tabId) {
        const tabIndex = this.tabs.findIndex(tab => tab.id === tabId);
        if (tabIndex !== -1) {
          const tab = this.tabs[tabIndex];
          tab.element.remove();
          tab.view.remove();
          this.tabs.splice(tabIndex, 1);
          
          if (this.activeTabId === tabId) {
            if (this.tabs.length > 0) {
              this.activateTab(this.tabs[Math.max(0, tabIndex - 1)].id);
            } else {
              this.activeTabId = null;
            }
          }
          
          if (this.tabs.length === 0) this.createTab('https://grok.com');
          else this.updateNewTabButtonPosition();
        }
      }
    };
    
    window.api.receive('shortcut-new-tab', () => tabManager.createTab('https://grok.com'));
    window.api.receive('shortcut-next-tab', () => tabManager.activateNextTab());
    window.api.receive('shortcut-prev-tab', () => tabManager.activatePrevTab());
    window.api.receive('shortcut-reload-tab', () => tabManager.reloadActiveTab());
    window.api.receive('shortcut-show-info', () => window.api.showAppInfo());
    window.api.receive('open-about-tab', (aboutUrl) => tabManager.createTab(aboutUrl));

    const usageStats = {
      isActive: false,
      refreshInterval: null,
      statusBar: null,
      button: null,
      grok4Hidden: false,
      
      init() {
        this.statusBar = document.getElementById('usage-status-bar');
        this.button = document.getElementById('usage-btn');
        if (this.button) this.button.addEventListener('click', () => this.toggle());
        
        try { this.isActive = localStorage.getItem('grokDesktopUsageBarActive') === 'true'; } catch (e) {}
        if (this.isActive) {
          this.button.classList.add('active');
          this.statusBar.classList.add('active');
          document.body.classList.add('usage-bar-active');
          this.fetchStats();
          this.refreshInterval = setInterval(() => this.fetchStats(), 5000);
        }
        
        try { this.grok4Hidden = localStorage.getItem('grokDesktopHideGrok4') === 'true'; } catch (e) {}
        const grok4Toggle = document.getElementById('usage-grok4-toggle');
        if (grok4Toggle) {
          this.applyGrok4Visibility();
          grok4Toggle.addEventListener('click', () => this.toggleGrok4());
        }
      },
      
      toggleGrok4() {
        this.grok4Hidden = !this.grok4Hidden;
        try { localStorage.setItem('grokDesktopHideGrok4', this.grok4Hidden); } catch (e) {}
        this.applyGrok4Visibility();
      },
      
      applyGrok4Visibility() {
        const grok4Toggle = document.getElementById('usage-grok4-toggle');
        const grok4Container = document.getElementById('usage-grok4-container');
        if (this.grok4Hidden) {
          grok4Container.classList.add('hidden-stat');
          grok4Toggle.classList.add('hidden');
        } else {
          grok4Container.classList.remove('hidden-stat');
          grok4Toggle.classList.remove('hidden');
        }
      },
      
      toggle() {
        this.isActive = !this.isActive;
        try { localStorage.setItem('grokDesktopUsageBarActive', this.isActive); } catch (e) {}
        
        if (this.isActive) {
          this.button.classList.add('active');
          this.statusBar.classList.add('active');
          document.body.classList.add('usage-bar-active');
          this.fetchStats();
          this.refreshInterval = setInterval(() => this.fetchStats(), 5000);
        } else {
          this.button.classList.remove('active');
          this.statusBar.classList.remove('active');
          document.body.classList.remove('usage-bar-active');
          if (this.refreshInterval) clearInterval(this.refreshInterval);
        }
      },
      
      async fetchStats() {
        try {
          const data = await window.api.fetchGrokRateLimits();
          this.updateDisplay(data);
        } catch (error) {
          this.showError();
        }
      },
      
      updateDisplay(data) {
        const lowEffortEl = document.getElementById('usage-low-effort');
        const highEffortEl = document.getElementById('usage-high-effort');
        const grok4HeavyEl = document.getElementById('usage-grok4-heavy');
        const refillContainer = document.getElementById('usage-refill-container');
        const refillEl = document.getElementById('usage-refill');

        if (data.error || data.DEFAULT?.error) {
          lowEffortEl.textContent = 'Login required';
          highEffortEl.textContent = '--';
          grok4HeavyEl.textContent = '--';
          refillContainer.style.display = 'none';
          return;
        }
        
        const lowRemaining = data.DEFAULT?.lowEffortRateLimits?.remainingQueries ?? '--';
        const totalTokens = data.DEFAULT?.totalTokens ?? null;
        if (lowRemaining !== '--' && totalTokens) {
          lowEffortEl.textContent = `${lowRemaining} / ${totalTokens}`;
          this.applyWarningClass(lowEffortEl, lowRemaining, totalTokens);
        } else lowEffortEl.textContent = lowRemaining;
        
        const highRemaining = data.DEFAULT?.highEffortRateLimits?.remainingQueries ?? '--';
        const highCost = data.DEFAULT?.highEffortRateLimits?.cost ?? null;
        if (highRemaining !== '--' && totalTokens && highCost) {
          const highTotal = Math.floor(totalTokens / highCost);
          highEffortEl.textContent = `${highRemaining} / ${highTotal}`;
          this.applyWarningClass(highEffortEl, highRemaining, highTotal);
        } else highEffortEl.textContent = highRemaining;
        
        const grok4Remaining = data.GROK4HEAVY?.remainingQueries ?? '--';
        const grok4Total = data.GROK4HEAVY?.totalQueries ?? null;
        if (grok4Remaining !== '--' && grok4Total) {
          grok4HeavyEl.textContent = `${grok4Remaining} / ${grok4Total}`;
          this.applyWarningClass(grok4HeavyEl, grok4Remaining, grok4Total);
        } else grok4HeavyEl.textContent = grok4Remaining;
        
        const maxWait = Math.max(
          data.DEFAULT?.lowEffortRateLimits?.waitTimeSeconds ?? 0,
          data.DEFAULT?.highEffortRateLimits?.waitTimeSeconds ?? 0
        );
        
        if (maxWait > 0) {
          refillContainer.style.display = 'flex';
          refillEl.textContent = this.formatTime(maxWait);
        } else refillContainer.style.display = 'none';
      },
      
      applyWarningClass(element, remaining, total) {
        element.classList.remove('warning', 'critical');
        if (typeof remaining === 'number' && typeof total === 'number' && total > 0) {
          const ratio = remaining / total;
          if (ratio <= 0.1) element.classList.add('critical');
          else if (ratio <= 0.25) element.classList.add('warning');
        }
      },
      
      formatTime(seconds) {
        if (!seconds || seconds <= 0) return '';
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = seconds % 60;
        return minutes > 0 ? `${minutes}m ${remainingSeconds}s` : `${remainingSeconds}s`;
      },
      
      showError() {
        document.getElementById('usage-low-effort').textContent = 'Error';
        document.getElementById('usage-high-effort').textContent = '--';
        document.getElementById('usage-grok4-heavy').textContent = '--';
        document.getElementById('usage-refill-container').style.display = 'none';
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      tabManager.init();
      usageStats.init();

      const indicator = document.getElementById('update-indicator');
      if (indicator) {
        indicator.addEventListener('click', () => {
          window.api.openExternal(latestReleaseUrl || 'https://github.com/AnRkey/Grok-Desktop/releases/latest');
        });
      }
      const updateBtn = document.getElementById('update-btn');
      if (updateBtn) {
        updateBtn.addEventListener('click', () => {
          window.api.openExternal(latestReleaseUrl || 'https://github.com/AnRkey/Grok-Desktop/releases/latest');
        });
      }
      const infoBtn = document.getElementById('info-btn');
      if (infoBtn) {
        infoBtn.addEventListener('click', () => window.api.showAppInfo());
      }

      // ===== Botão de Pasta =====
      const folderBtn = document.getElementById('folder-btn');
      if (folderBtn) {
        folderBtn.addEventListener('click', async () => {
          try {
            const folderPath = await window.api.selectFolder();
            if (!folderPath) return;

            currentWorkingFolder = folderPath;
            updateFolderIndicator(folderPath);

            const result = await window.api.readFolderStructure(folderPath);
            if (result.error) {
              alert('Erro ao ler pasta: ' + result.error);
              return;
            }

            function formatStructure(items, indent = 0) {
              let text = '';
              const prefix = '  '.repeat(indent);
              for (const item of items) {
                if (item.type === 'directory') {
                  text += `${prefix}📁 ${item.name}/\n`;
                  if (item.children) text += formatStructure(item.children, indent + 1);
                } else if (item.type === 'file') {
                  text += `${prefix}📄 ${item.name}\n`;
                } else {
                  text += `${prefix}${item.name}\n`;
                }
              }
              return text;
            }

            const structureText = formatStructure(result.structure);
            const contextMessage = `Estou trabalhando nesta pasta do meu computador:

📂 **${result.path}**

Estrutura de arquivos:
\`\`\`
${structureText}
\`\`\`

Use essa estrutura como contexto. Posso pedir para você:
- Ler arquivos específicos (ex: "leia o arquivo src/main.js")
- Buscar arquivos (ex: "procure por arquivos que contenham package")
- Modificar arquivos (ex: "altere o package.json para versão 1.4.0")

Quando eu pedir, use as ferramentas disponíveis.`;

            await injectIntoGrokChat(contextMessage);

          } catch (err) {
            console.error(err);
            alert('Erro: ' + err.message);
          }
        });
      }

      // ===== Fechar pasta =====
      const folderCloseBtn = document.getElementById('folder-close');
      if (folderCloseBtn) {
        folderCloseBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          currentWorkingFolder = null;
          updateFolderIndicator(null);
        });
      }

      // ===== Botão DevTools =====
      const devtoolsBtn = document.getElementById('devtools-btn');
      if (devtoolsBtn) {
        devtoolsBtn.addEventListener('click', () => {
          const activeTab = tabManager.tabs.find(t => t.id === tabManager.activeTabId);
          if (activeTab && activeTab.webview) {
            try {
              activeTab.webview.openDevTools();
            } catch (e) {
              alert('Não foi possível abrir o DevTools: ' + e.message);
            }
          }
        });
      }
    });
  </script>
