<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; object-src 'none'; base-uri 'none'; frame-src https: file:;">
  <title>Grok Desktop</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --color-text: #000000;
      --color-bg-toolbar: #F9F8F6;
      --color-bg-tab: #F9F8F6;
      --color-bg-tab-active: #ffffff;
      --color-bg-content: #ffffff;
      --color-border: #dddddd;
      --color-hover: #dddddd;
      --color-aot-border: #cccccc;
      --color-aot-hover: #e6e6e6;
      --scrollbar-track: #f1f1f1;
      --scrollbar-thumb: #c1c1c1;
      --scrollbar-thumb-hover: #a8a8a8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-text: #e6e6e6;
        --color-bg-toolbar: #1e1f22;
        --color-bg-tab: #2b2d31;
        --color-bg-tab-active: #3b3e45;
        --color-bg-content: #2b2d31;
        --color-border: #444444;
        --color-hover: #444444;
        --color-aot-border: #555555;
        --color-aot-hover: #444444;
        --scrollbar-track: #2a2b2f;
        --scrollbar-thumb: #55595f;
        --scrollbar-thumb-hover: #666b73;
      }
    }

    /* Also support JS-driven theme toggling via a class */
    :root.dark {
      --color-text: #e6e6e6;
      --color-bg-toolbar: #1e1f22;
      --color-bg-tab: #2b2d31;
      --color-bg-tab-active: #3b3e45;
      --color-bg-content: #2b2d31;
      --color-border: #444444;
      --color-hover: #444444;
      --color-aot-border: #555555;
      --color-aot-hover: #444444;
      --scrollbar-track: #2a2b2f;
      --scrollbar-thumb: #55595f;
      --scrollbar-thumb-hover: #666b73;
    }

    /* Basic styling for the tabs */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: var(--color-text);
    }

    .tabs-container {
      width: 100%;
      height: 40px;
      background-color: var(--color-bg-toolbar);
      display: flex;
      overflow: hidden; /* keep controls visible; only tabs scroll */
      position: relative;
    }

    .tabs {
      display: flex;
      flex: 1 1 auto;
      min-width: 0;            /* allow flex child to shrink so it doesn't push controls */
      overflow-x: auto;        /* scroll just the tabs area */
      overflow-y: hidden;
    }

    .tabs-scroll {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: none;
      color: var(--color-text);
      font-size: 18px;
      width: 28px;
      height: 40px;
      cursor: pointer;
      align-self: center;
      display: none; /* hidden by default; shown only when needed */
    }
    .tabs-scroll:hover { background-color: var(--color-hover); }
    .tabs-scroll-left { margin-right: 2px; }
    .tabs-scroll-right { margin-left: 2px; }

    .tab {
      display: flex;
      align-items: center;
      border-right: 1px solid var(--color-border);
      min-width: 180px;
      max-width: 220px;
      padding: 0 10px;
      height: 40px;
      background-color: var(--color-bg-tab);
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .tab.active {
      background-color: var(--color-bg-tab-active);
    }

    .tab-title {
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      margin-right: 20px;
    }

    .tab-close {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      margin: 0;
      padding: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      color: var(--color-text);
    }

    .tab-close:hover {
      background-color: var(--color-hover);
    }

    .new-tab-button {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      width: 30px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 5px;
      color: var(--color-text);
    }

    .new-tab-button:hover {
      background-color: var(--color-hover);
    }

    .app-controls {
      display: flex;
      align-items: center;
      padding: 0 5px;
      flex: 0 0 auto;          /* reserve space; never shrink */
      white-space: nowrap;
    }

    .aot-button {
      background: none;
      border: 1px solid var(--color-aot-border);
      border-radius: 4px;
      margin-left: 5px;
      padding: 2px 6px;
      font-size: 12px;
      cursor: pointer;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--color-text);
    }

    .aot-button:hover {
      background-color: var(--color-aot-hover);
    }

    .aot-button.active {
      background-color: #4CAF50;
      color: white;
      border-color: #4CAF50;
    }

    .reload-button {
      background: none;
      border: 1px solid var(--color-aot-border);
      border-radius: 4px;
      margin-right: 5px;
      padding: 2px 6px;
      font-size: 16px;
      cursor: pointer;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--color-text);
    }

    .reload-button:hover {
      background-color: var(--color-aot-hover);
    }

    .reload-button.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .reload-icon {
      display: inline-block;
      transform-origin: center;
      pointer-events: none;
    }

    .reload-button.loading .reload-icon {
      animation: spin-reload 1s linear infinite;
    }

    @keyframes spin-reload {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .views-container {
      height: calc(100vh - 40px);
      width: 100%;
      position: relative;
      background-color: var(--color-bg-content);
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      background-color: var(--color-bg-content);
    }

    .view.active {
      display: block;
    }

    webview {
      display: flex;
      width: 100%;
      height: 100%;
      border: none;
      background-color: var(--color-bg-content);
    }

    .usage-status-bar {
      display: none;
      min-height: 32px;
      background-color: var(--color-bg-toolbar);
      border-top: 1px solid var(--color-border);
      padding: 0 12px 8px 12px;
      align-items: center;
      justify-content: flex-start;
      gap: 24px;
      font-size: 12px;
      color: var(--color-text);
      flex-shrink: 0;
      box-sizing: content-box;
    }

    .usage-status-bar.active {
      display: flex;
    }

    .usage-stat {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .usage-label {
      opacity: 0.7;
    }

    .usage-value {
      font-weight: 600;
    }

    .usage-value.warning {
      color: #f39c12;
    }

    .usage-value.critical {
      color: #e74c3c;
    }

    .usage-refill .usage-value {
      color: #3498db;
    }

    .usage-toggle {
      padding: 2px 6px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s ease;
      font-size: 14px;
      user-select: none;
      order: -1;
      margin-right: -19px;
    }

    .usage-toggle:hover {
      opacity: 1;
    }

    .usage-toggle.hidden .toggle-icon {
      opacity: 0.4;
    }

    .usage-stat.hidden-stat {
      display: none;
    }

    /* Adjust views container height when status bar is active */
    body.usage-bar-active .views-container {
      height: calc(100vh - 40px - 41px);
    }
  </style>
</head>
<body>
  <div class="tabs-container">
    <button class="tabs-scroll tabs-scroll-left" id="tabs-scroll-left" aria-hidden="true">&#x2039;</button>
    <div class="tabs" id="tabs"></div>
    <button class="tabs-scroll tabs-scroll-right" id="tabs-scroll-right" aria-hidden="true">&#x203A;</button>
    <div class="app-controls">
  <div id="update-indicator" style="margin-right:8px;font-size:12px;opacity:0.9;cursor:pointer;text-decoration:underline;display:none;"></div>
  <button class="reload-button" id="reload-button" title="Reload current tab"><span class="reload-icon">↻</span></button>
  <button class="aot-button" id="aot-button" title="Always on top (off by default; when on, other apps cannot cover this window)">AOT</button>
  <button class="aot-button" id="update-btn" style="margin-left:8px;display:none;background:#ff3333;color:#fff;border-color:#cc0000;" title="Update available">↑</button>
  <button class="aot-button" id="usage-btn" style="margin-left:8px;" title="Toggle Usage Stats">s</button>
  <button class="aot-button" id="info-btn" style="margin-left:8px;" title="About">i</button>
    </div>
  </div>
  <div class="views-container" id="views"></div>
  <div class="usage-status-bar" id="usage-status-bar">
    <div class="usage-stat">
      <span class="usage-label">Low Effort:</span>
      <span class="usage-value" id="usage-low-effort">--</span>
    </div>
    <div class="usage-stat">
      <span class="usage-label">High Effort:</span>
      <span class="usage-value" id="usage-high-effort">--</span>
    </div>
    <div class="usage-stat" id="usage-grok4-container">
      <span class="usage-label">Grok 4 Heavy:</span>
      <span class="usage-value" id="usage-grok4-heavy">--</span>
    </div>
    <div class="usage-stat usage-refill" id="usage-refill-container" style="display:none;">
      <span class="usage-label">Refill:</span>
      <span class="usage-value" id="usage-refill">--</span>
    </div>
    <div class="usage-toggle" id="usage-grok4-toggle" title="Toggle Grok 4 Heavy stats">
      <span class="toggle-icon">👁</span>
    </div>
  </div>

  <script src="src/ui.js" defer></script>
</body>
</html>
