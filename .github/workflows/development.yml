name: Development validation

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm test
      - name: Electron runtime checks (Windows)
        if: runner.os == 'Windows'
        run: npm run test:electron
      - name: Electron runtime checks (Linux)
        if: runner.os == 'Linux'
        env:
          GROK_DISABLE_GPU: 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y openbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          dbus-run-session -- xvfb-run -a sh -c 'openbox >/tmp/grok-openbox.log 2>&1 & npm run test:electron'
      - name: Windows packages
        if: runner.os == 'Windows'
        run: npm run build
      - name: Windows ZIP and 7z archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-archives.ps1
      - name: Linux packages and archives
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm p7zip-full
          npm run build-linux
          bash scripts/build-linux-archives.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grok-1.3.0-${{ runner.os }}-test-builds
          path: |
            build/Grok-Desktop*
            build/smoke-1.3.0.png
          if-no-files-found: error
          retention-days: 30
